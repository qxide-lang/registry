name: Search index

on:
  push:
    branches: [main]
    paths: ["index/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: search-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python scripts/build_search.py
      # Only search.json is committed; the bot never touches index/ or packages/.
      - run: |
          if git diff --quiet -- search.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search.json
          git commit -m "chore: update search.json [skip ci]"
          git push
