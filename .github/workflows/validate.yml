name: Validate

# Pull requests are checked by this workflow and scripts/validate.py as they are on the target
# branch (`pull_request_target`), so a pull request cannot edit or skip its own check. The pull
# request is checked out only as data and nothing from it is executed; the token is read-only and
# is not stored in either checkout.
on:
  pull_request_target:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: base
          persist-credentials: false
      # The merge result, as a `pull_request` run would see it: a branch behind the target would
      # otherwise appear to delete everything added to the target since it was created.
      - if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # The author comes from the event GitHub generates for the pull request (`pull_request.user`),
      # which the pull request cannot set; not `github.actor` (whoever triggered this run) and not
      # commit metadata. Owners are matched by the numeric id; the login is only shown.
      - if: github.event_name == 'pull_request_target'
        env:
          BASE: origin/${{ github.base_ref }}
          AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: python -I base/scripts/validate.py --root pr --base "$BASE" --author-id "$AUTHOR_ID" --author-login "$AUTHOR_LOGIN" --summary "$GITHUB_STEP_SUMMARY"
      - if: github.event_name != 'pull_request_target'
        run: python -I base/scripts/validate.py --root base --summary "$GITHUB_STEP_SUMMARY"
